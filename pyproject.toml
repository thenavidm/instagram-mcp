[project]
# The plain name "instagram-mcp" is already published on PyPI by somebody else,
# so telling a reader to install it would fetch a stranger's code. PyPI has no
# scopes, so an owner prefix is the closest equivalent to the @thenavidm npm
# scope the other servers use. The installed command is still `instagram-mcp`.
name = "thenavidm-instagram-mcp"
version = "0.3.0"
description = "Instagram for AI agents. Official Graph API plus an opt-in unofficial tier, behind one tool surface."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Navid Moazzez" }]
keywords = ["mcp", "model-context-protocol", "instagram", "claude", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# httpx2 rather than httpx: the MCP SDK already depends on it, so this keeps
# one HTTP stack in the environment instead of two.
dependencies = [
  "mcp>=2.1.1",
  "httpx2>=2.5.0",
  "pydantic>=2.12.0",
]

[project.optional-dependencies]
# The unofficial tier is not installed by default. That is deliberate: someone
# who runs the plain package cannot reach it even by passing the flag.
unofficial = ["instagrapi>=2.18.18"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/thenavidm/instagram-mcp"
Issues = "https://github.com/thenavidm/instagram-mcp/issues"

[project.scripts]
instagram-mcp = "instagram_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_mcp"]
# SKILL.md ships inside the package so an agent that installs the server also
# learns how to drive it. The README teaches a person to install it; SKILL.md
# teaches a model to use it well.
force-include = { "SKILL.md" = "instagram_mcp/SKILL.md" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
